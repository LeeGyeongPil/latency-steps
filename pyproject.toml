[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latency-steps"
version = "0.1.1"
description = "Find when latency stepped up in raw event logs, then see whether it is one host, a load-mix shift, or everything."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeeGyeongPil" }]
keywords = ["latency", "change-point", "logs", "percentiles", "regression", "duckdb", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
]
dependencies = ["duckdb>=2.0.0,<3"]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/latency-steps"
Issues = "https://github.com/LeeGyeongPil/latency-steps/issues"
Changelog = "https://github.com/LeeGyeongPil/latency-steps/blob/main/CHANGELOG.md"

[project.scripts]
latency-steps = "latency_steps.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/latency_steps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
